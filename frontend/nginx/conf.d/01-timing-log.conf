# Log de tempo por rota, lido pelo plano de medicao. Formato fixo:
#   time method uri status bytes request_time upstream_response_time
# $uri nao inclui a query string. Health checks (user agent Wget) ficam fora.
map $http_user_agent $espaco_loggable {
    default 1;
    ~*^Wget 0;
}

log_format espaco_timing '$time_iso8601 $request_method $uri $status '
                         '$body_bytes_sent $request_time $upstream_response_time';

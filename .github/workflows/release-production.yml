name: Release validated candidate to Dokploy

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full SHA already validated on main
        required: true
        type: string

concurrency:
  group: espaco-whats-production
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

jobs:
  release:
    name: Advance the Dokploy deployment branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Enforce the Rio Branco release window
        shell: bash
        run: |
          current_time="$(TZ=America/Rio_Branco date +%H%M%S)"
          if (( 10#$current_time < 115000 || 10#$current_time >= 120000 )); then
            echo "Production releases are allowed only from 11:50:00 through 11:59:59 in America/Rio_Branco."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify main and the successful validation run
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        shell: bash
        run: |
          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "release_sha must be a full Git commit SHA."
            exit 1
          fi
          git fetch origin main deploy
          main_sha="$(git rev-parse refs/remotes/origin/main)"
          if [[ "$RELEASE_SHA" != "$main_sha" ]]; then
            echo "Only the current head of main can be released."
            exit 1
          fi
          successful_runs="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci-deploy.yml/runs?head_sha=${RELEASE_SHA}&status=success&per_page=1" \
            --jq '.total_count')"
          if [[ "$successful_runs" == "0" ]]; then
            echo "No successful production-candidate validation exists for this SHA."
            exit 1
          fi

      - name: Recheck window and advance deployment branch
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        shell: bash
        run: |
          current_time="$(TZ=America/Rio_Branco date +%H%M%S)"
          if (( 10#$current_time < 115000 || 10#$current_time >= 120000 )); then
            echo "The release window closed before dispatching Dokploy. Try again on the next day."
            exit 1
          fi
          deployed_sha="$(git rev-parse refs/remotes/origin/deploy)"
          git push origin "${RELEASE_SHA}:refs/heads/deploy" \
            "--force-with-lease=refs/heads/deploy:${deployed_sha}"

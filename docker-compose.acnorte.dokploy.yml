name: espaco-whats-acnorte

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${ACNORTE_POSTGRES_DB}
      POSTGRES_USER: ${ACNORTE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${ACNORTE_POSTGRES_PASSWORD}
      TZ: ${TZ:-America/Rio_Branco}
    volumes:
      - postgres_data_v18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      - internal

  redis:
    image: redis:8.2.1-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --save
      - "60"
      - "1"
      - --requirepass
      - ${ACNORTE_REDIS_PASSWORD}
    environment:
      REDIS_PASSWORD: ${ACNORTE_REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: "3000"
      TZ: ${TZ:-America/Rio_Branco}
      DB_DIALECT: postgres
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${ACNORTE_POSTGRES_USER}
      DB_PASS: ${ACNORTE_POSTGRES_PASSWORD}
      DB_NAME: ${ACNORTE_POSTGRES_DB}
      DB_TIMEZONE: ${DB_TIMEZONE:--05:00}
      REDIS_URI: redis://:${ACNORTE_REDIS_PASSWORD}@redis:6379
      REDIS_OPT_LIMITER_MAX: ${REDIS_OPT_LIMITER_MAX:-1}
      REDIS_OPT_LIMITER_DURATION: ${REDIS_OPT_LIMITER_DURATION:-3000}
      FRONTEND_URL: ${PUBLIC_PROTOCOL:-https}://${ACNORTE_HOST}
      FRONTEND_URL_REGEX: ^${PUBLIC_PROTOCOL:-https}://${ACNORTE_HOST}$$
      BACKEND_URL: ${PUBLIC_PROTOCOL:-https}://${ACNORTE_HOST}/backend
      APP_BASE_DOMAIN: ${ACNORTE_BASE_DOMAIN}
      EMAIL_ADDRESS: ${ACNORTE_EMAIL_ADDRESS}
      ADMIN_PASSWORD: ${ACNORTE_ADMIN_PASSWORD}
      USER_LIMIT: ${USER_LIMIT:-10000}
      CONNECTIONS_LIMIT: ${CONNECTIONS_LIMIT:-100000}
      CLOSED_SEND_BY_ME: ${CLOSED_SEND_BY_ME:-true}
      SOCKET_ADMIN: ${SOCKET_ADMIN:-true}
      VERIFY_TOKEN: ${ACNORTE_VERIFY_TOKEN}
      PLATFORM_API_KEY: ${ACNORTE_PLATFORM_API_KEY}
      PLATFORM_WEBHOOK_SECRET: ${ACNORTE_PLATFORM_WEBHOOK_SECRET}
      PLATFORM_WEBHOOK_URL: ${ACNORTE_PLATFORM_WEBHOOK_URL:-}
      PLATFORM_TENANT_URL_TEMPLATE: ${PUBLIC_PROTOCOL:-https}://{slug}.${ACNORTE_BASE_DOMAIN}
      MCP_BASE_URL: ${PUBLIC_PROTOCOL:-https}://${ACNORTE_HOST}/backend
      MCP_TIMEZONE: ${MCP_TIMEZONE:-America/Rio_Branco}
      MCP_PRIVATE_KEY: ${ACNORTE_MCP_PRIVATE_KEY}
      MCP_PUBLIC_KEY: ${ACNORTE_MCP_PUBLIC_KEY}
      MCP_CURSOR_SECRET: ${ACNORTE_MCP_CURSOR_SECRET}
      MCP_KEY_ID: ${ACNORTE_MCP_KEY_ID:-acnorte-mcp-1}
      WACALLS_ENABLED: "false"
      WACALLS_ALLOWED_COMPANY_IDS: ""
    volumes:
      - backend_public:/usr/src/app/public
      - backend_private:/usr/src/app/private
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "require('http').get('http://127.0.0.1:3000/api/platform/v1/health',
          r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 90s
    stop_grace_period: 45s
    restart: unless-stopped
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      FRONTEND_HOST: ${ACNORTE_HOST}
      APP_BASE_DOMAIN: ${ACNORTE_BASE_DOMAIN}
      EMAIL_ADDRESS: ${ACNORTE_EMAIL_ADDRESS}
      BACKEND_SERVICE: backend
      BACKEND_PATH: /backend
      BACKEND_PROTOCOL: http
      LANDING_WHATSAPP_NUMBER: ${LANDING_WHATSAPP_NUMBER:-}
      LOG_LEVEL: ${LOG_LEVEL:-warn}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    stop_grace_period: 30s
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.espacowhats-acnorte-http.rule=Host(`${ACNORTE_HOST}`)"
      - "traefik.http.routers.espacowhats-acnorte-http.entrypoints=web"
      - "traefik.http.routers.espacowhats-acnorte-http.priority=200"
      - "traefik.http.routers.espacowhats-acnorte-http.service=espacowhats-acnorte-frontend"
      - "traefik.http.services.espacowhats-acnorte-frontend.loadbalancer.server.port=80"
    networks:
      - internal
      - dokploy-network

networks:
  internal:
    driver: bridge
  dokploy-network:
    external: true

volumes:
  postgres_data_v18:
  redis_data:
  backend_public:
  backend_private:

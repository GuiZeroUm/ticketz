name: espaco-whats-acnorte-production

# Production data is never imported from dev. This runtime shares the existing
# production store, but is the sole socket/worker owner of company 9.
services:
  acnorte-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    mem_limit: 1536m
    command: ["sh", "-c", "npx sequelize db:migrate --config dist/config/database.js --migrations-path dist/database/migrations && exec node dist/server.js"]
    environment:
      NODE_ENV: production
      PORT: "3000"
      TZ: ${TZ:-America/Rio_Branco}
      DB_DIALECT: postgres
      DB_HOST: espaco-whats-7oyzgd-postgres-1
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER}
      DB_PASS: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      DB_TIMEZONE: ${DB_TIMEZONE:--05:00}
      REDIS_URI: redis://:${REDIS_PASSWORD}@espaco-whats-7oyzgd-redis-1:6379
      QUEUE_PREFIX: acnorte-production
      TENANT_RUNTIME_COMPANY_ID: "9"
      MASTER_COMPANY_ID: "9"
      WHATSAPP_AUTOSTART_ENABLED: "true"
      WHATSAPP_AUTOSTART_EXISTING_ONLY: "true"
      FRONTEND_URL: https://acnorte.espacowhats.com.br
      FRONTEND_URL_REGEX: ^https://acnorte\.espacowhats\.com\.br$$
      BACKEND_URL: https://acnorte.espacowhats.com.br/backend
      APP_BASE_DOMAIN: espacowhats.com.br
      SOCKET_ADMIN: "false"
      LOG_LEVEL: warn
      REDIS_OPT_LIMITER_MAX: ${REDIS_OPT_LIMITER_MAX:-1}
      REDIS_OPT_LIMITER_DURATION: ${REDIS_OPT_LIMITER_DURATION:-3000}
      CLOSED_SEND_BY_ME: ${CLOSED_SEND_BY_ME:-true}
      USER_LIMIT: ${USER_LIMIT:-10000}
      CONNECTIONS_LIMIT: ${CONNECTIONS_LIMIT:-100000}
      VERIFY_TOKEN: ${VERIFY_TOKEN}
      MCP_BASE_URL: https://acnorte.espacowhats.com.br/backend
      MCP_TIMEZONE: ${MCP_TIMEZONE:-America/Rio_Branco}
      MCP_PRIVATE_KEY: ${MCP_PRIVATE_KEY}
      MCP_PUBLIC_KEY: ${MCP_PUBLIC_KEY}
      MCP_CURSOR_SECRET: ${MCP_CURSOR_SECRET}
      MCP_KEY_ID: ${MCP_KEY_ID:-espaco-whats-mcp-1}
      ACNORTE_SGA_ENABLED: "true"
      ACNORTE_SGA_COMPANY_ID: "9"
      ACNORTE_SGA_TOKEN: ${ACNORTE_SGA_TOKEN:?SGA production token is required}
      WACALLS_ENABLED: "false"
      WACALLS_ALLOWED_COMPANY_IDS: ""
      VOICE_TRANSCRIPTION_PROVIDER: ${VOICE_TRANSCRIPTION_PROVIDER:-groq}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - production_public:/usr/src/app/public
      - production_private:/usr/src/app/private
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000/api/platform/v1/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 90s
    stop_grace_period: 45s
    restart: unless-stopped
    networks:
      - internal
      - production_data

  acnorte-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    mem_limit: 256m
    environment:
      FRONTEND_HOST: acnorte.espacowhats.com.br
      APP_BASE_DOMAIN: espacowhats.com.br
      EMAIL_ADDRESS: ${EMAIL_ADDRESS}
      BACKEND_SERVICE: acnorte-backend
      BACKEND_PATH: /backend
      BACKEND_PROTOCOL: https
      LOG_LEVEL: warn
    depends_on:
      acnorte-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.acnorte-production-http.rule=Host(`acnorte.espacowhats.com.br`)"
      - "traefik.http.routers.acnorte-production-http.entrypoints=web"
      - "traefik.http.routers.acnorte-production-http.priority=300"
      - "traefik.http.routers.acnorte-production-http.middlewares=redirect-to-https@file"
      - "traefik.http.routers.acnorte-production-http.service=acnorte-production-frontend"
      - "traefik.http.routers.acnorte-production-https.rule=Host(`acnorte.espacowhats.com.br`)"
      - "traefik.http.routers.acnorte-production-https.entrypoints=websecure"
      - "traefik.http.routers.acnorte-production-https.priority=300"
      - "traefik.http.routers.acnorte-production-https.service=acnorte-production-frontend"
      - "traefik.http.routers.acnorte-production-https.tls=true"
      - "traefik.http.routers.acnorte-production-https.tls.certresolver=letsencrypt"
      - "traefik.http.services.acnorte-production-frontend.loadbalancer.server.port=80"
    networks:
      - internal
      - dokploy-network

networks:
  internal:
  production_data:
    external: true
    name: espaco-whats-7oyzgd_internal
  dokploy-network:
    external: true
volumes:
  production_public:
    external: true
    name: espaco-whats-7oyzgd_backend_public
  production_private:
    external: true
    name: espaco-whats-7oyzgd_backend_private
